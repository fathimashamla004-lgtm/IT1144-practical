<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Sweet Celebrations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Sweet<b>Cakes.</b></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="cakes.html">Cakes</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <a href="contact.html" class="btn">Book Now</a>
    </nav>

    <section class="content-section" style="max-width: 700px; margin: 0 auto;">
        <h2>Let's Plan Your Celebration</h2>
        <p class="section-subtitle">Drop us a line and let our professional planner team create magic for you.</p>
        
        <form id="event-form" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label for="service">Requested Service</label>
                <input type="text" id="service" required placeholder="e.g., Custom Wedding Cake, Birthday Event">
            </div>
            <div class="form-group">
                <label for="message">Event Details</label>
                <textarea id="message" rows="5" required placeholder="Tell us your date, location, and details..."></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Submit Inquiry</button>
        </form>
    </section>

    <footer><p>&copy; 2026 Sweet Celebrations. All rights reserved.</p></footer>
    <script src="script.js"></script>
</body>
</html>
